<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Симулятор плана запуска смены — MENSORRY</title>
<style>
:root{
  --bg:#0a0a0b; --card:#131316; --card2:#18181c; --card3:#1d1d22; --line:#232327; --line2:#2e2e35;
  --txt:#e4e4e7; --num:#fafafa; --mut:#8b8b94;
  --acc:#8b5cf6; --acc2:#a78bfa; --acc3:#c4b5fd; --green:#22c55e; --red:#ef4444; --red2:#f87171; --cyan:#38bdf8; --pink:#f472b6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
a{color:var(--acc2)}
button{font-family:inherit;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);margin-right:10px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 18px;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;font-weight:700;color:var(--num);letter-spacing:-.02em;white-space:nowrap}
.top .brand small{color:var(--mut);font-weight:500;margin-left:8px}
.stat{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-width:86px}
.stat b{font-size:20px;color:var(--num);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.stat.bad b{color:var(--red2)}
.prog{flex:1;min-width:120px}
.prog .bar{height:8px;background:#17171a;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d28d9,#a78bfa);box-shadow:0 0 14px rgba(139,92,246,.6);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.prog span{font-size:12px;color:var(--mut)}
/* layout */
.main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2)}
.task .n{font-size:13px;color:var(--mut)}
.task .t{font-size:20px;font-weight:700;color:var(--num);margin:2px 0 6px}
.task .h{color:var(--txt);font-size:15px}
.task.pro .h{color:var(--mut);font-style:italic}
.log{max-height:260px;overflow:auto;font-size:14px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log .ok{color:#86efac}.log .er{color:var(--red2)}
.rule{font-size:14px;color:var(--mut)}
.rule b{color:var(--num)}
/* screen */
.screen{position:relative;background:radial-gradient(1200px 600px at 70% 0%,#1a1430 0%,#0d0d10 60%);border:1px solid var(--line2);border-radius:20px;overflow:hidden;min-height:620px;display:flex;flex-direction:column}
.win{flex:1;margin:14px 14px 0;background:var(--card);border:1px solid var(--line2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s cubic-bezier(.2,.7,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.45)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.wt{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--card2);border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--num)}
.wt .lights{display:flex;gap:6px;margin-right:6px}.wt .lights i{width:11px;height:11px;border-radius:50%;background:#2e2e35}
.wb{flex:1;overflow:auto;padding:16px}
.taskbar{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-top:1px solid var(--line);background:rgba(13,13,15,.9);margin-top:14px}
.tb{flex:none;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);color:var(--txt);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
.tb.on{border-color:var(--acc);background:#1e1832}
.ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--card3);border:1px solid var(--line2);color:var(--txt);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin:4px 6px 4px 0;transition:.15s;text-align:left}
.btn:hover{border-color:var(--acc);color:var(--num)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.grn{background:#14532d;border-color:var(--green);color:#dcfce7}
.btn.done{opacity:.55;border-style:dashed}
.btn.done::before{content:"✓";color:var(--green)}
.hl{animation:pulse 1.4s infinite;border-color:var(--acc2)!important}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.65)}70%{box-shadow:0 0 0 10px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* desktop */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.dicon{background:transparent;border:1px solid transparent;border-radius:16px;padding:14px 8px;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dicon:hover{background:var(--card2);border-color:var(--line2)}
.dicon .ico{width:52px;height:52px;border-radius:16px;font-size:20px}
.lock{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#060607}
.power{width:96px;height:96px;border-radius:50%;border:2px solid var(--line2);background:var(--card);color:var(--acc2);font-size:40px}
.power:hover{border-color:var(--acc)}
/* browser */
.tabs{display:flex;gap:6px;padding:8px 10px 0;background:var(--card2);overflow-x:auto;position:relative}
.tab{flex:none;border:1px solid var(--line);border-bottom:none;background:#151518;color:var(--mut);border-radius:10px 10px 0 0;padding:7px 12px;font-size:13px;font-weight:600}
.tab.on{background:var(--card);color:var(--num)}
.plus{flex:none;border:1px solid var(--line2);background:transparent;color:var(--acc2);border-radius:10px;padding:4px 12px;font-size:18px;margin-bottom:4px}
.menu{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:10px;margin:0 0 12px}
.menu .btn{margin:3px}
.url{margin:0;padding:8px 14px;font:13px "Roboto Mono",ui-monospace,monospace;color:var(--mut);background:var(--card);border-bottom:1px solid var(--line)}
.site{border-radius:14px;padding:16px;border:1px solid var(--line2);background:var(--card2)}
.site h4{margin:0 0 8px;font-size:18px;color:var(--num)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:#26262c;color:var(--mut)}
.pill.on{background:#14532d;color:#86efac}.pill.off{background:#3f1d1d;color:#fca5a5}
.big{font-size:64px;font-weight:800;color:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acc{font:13px "Roboto Mono",monospace;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
/* telegram */
.tg{display:grid;grid-template-columns:200px 1fr;gap:12px;height:100%}
.chats .btn{display:flex;width:100%;margin:0 0 6px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px}
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;background:#0f0f12;border-radius:14px;padding:12px;min-height:180px;max-height:330px;overflow:auto}
.m{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--card3);font-size:14px;white-space:pre-line}
.m.me{align-self:flex-end;background:#2e1f5e}
.m small{display:block;color:var(--mut);font-size:11px}
/* obs */
.obs{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.prev{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#2a1d3f,#3b2a4a 50%,#1e293b);position:relative;display:grid;place-items:center;color:#c4b5fd;font-weight:700;overflow:hidden}
.prev .live{position:absolute;top:10px;left:10px}
.dock{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.dock h5{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.meter{height:10px;border-radius:99px;background:linear-gradient(90deg,#22c55e 0 60%,#eab308 60% 85%,#ef4444 85%);position:relative;opacity:.9}
.meter i{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;left:55%;border-radius:2px}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;animation:pop .25s}
.modal h2{margin:0 0 10px;color:var(--num);font-size:22px}
.modal .opt{display:block;width:100%;margin:8px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red2);margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text]{width:100%;background:#0f0f12;border:1px solid var(--line2);border-radius:12px;padding:11px 12px;color:var(--num);font-size:16px;font-family:inherit}
input.err{border-color:var(--red)}
.ferr{color:var(--red2);font-size:13px;min-height:18px}
.brief{background:var(--card2);border-radius:14px;padding:12px 14px;font-size:14px}
.brief b{color:var(--num)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.choice button{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:14px;color:var(--txt);text-align:left}
.choice button.on{border-color:var(--acc);background:#1e1832}
.choice b{display:block;color:var(--num);font-size:17px}
.choice span{font-size:13px;color:var(--mut)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mist{border-left:3px solid var(--red);background:var(--card2);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.mist b{color:var(--red2)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--card3);border:1px solid var(--line2);border-radius:14px;padding:10px 16px;font-weight:600;transition:.25s;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{border-color:var(--green)}.toast.er{border-color:var(--red);color:#fecaca}
.hide{display:none!important}
@media (max-width:900px){
  .main{grid-template-columns:1fr;padding:10px}
  .top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .top .brand small{display:none}
  .stat{min-width:70px;padding:3px 9px}.stat b{font-size:17px}
  .prog{flex-basis:100%;order:9}
  .log{max-height:120px}
  .screen{min-height:560px}
  .win{margin:8px 8px 0}
  .obs,.grid2,.tg{grid-template-columns:1fr}
  .chats{display:flex;gap:6px}.chats .btn{width:auto}
  .big{font-size:48px}
  .choice,.res{grid-template-columns:1fr}
  .panel .rulecard{display:none}
}
</style>
</head>
